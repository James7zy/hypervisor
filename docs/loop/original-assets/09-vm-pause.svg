<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 322" width="680" height="644" font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="340" height="322" rx="8" fill="#fff"/><rect x="5" y="5" width="330" height="72" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity="0.08"/><text x="15" y="22" text-anchor="start" font-size="12" font-weight="600" fill="#2563eb">Delivery Loop</text><text x="15" y="39" text-anchor="start" font-size="11" font-weight="500" fill="#202124">实现 VM Pause 功能。</text><text x="15" y="54" text-anchor="start" font-size="10" font-weight="400" fill="#202124">架构师定义状态机，研发工程师实现暂停与恢复，</text><text x="15" y="68" text-anchor="start" font-size="10" font-weight="400" fill="#202124">测试专家验证目标 VM 停止推进、Service VM 继续运行。</text><path d="M170 77 v17" stroke="#64748b" fill="none" stroke-width="1.3"/><rect x="5" y="94" width="330" height="72" rx="5" stroke="#0891b2" fill="#0891b2" fill-opacity="0.08"/><text x="15" y="111" text-anchor="start" font-size="12" font-weight="600" fill="#0891b2">Quality Loop</text><text x="15" y="128" text-anchor="start" font-size="11" font-weight="500" fill="#202124">探索 Pause 的并发边界。</text><text x="15" y="143" text-anchor="start" font-size="10" font-weight="400" fill="#202124">主动检查双 vCPU 暂停竞争、重复 Pause、</text><text x="15" y="157" text-anchor="start" font-size="10" font-weight="400" fill="#202124">暂停期间 IRQ 到达、Pause 与 Resume 并发等情况。</text><path d="M170 166 v17" stroke="#64748b" fill="none" stroke-width="1.3"/><rect x="5" y="183" width="330" height="72" rx="5" stroke="#7c3aed" fill="#7c3aed" fill-opacity="0.08"/><text x="15" y="200" text-anchor="start" font-size="12" font-weight="600" fill="#7c3aed">Evolution Loop</text><text x="15" y="217" text-anchor="start" font-size="11" font-weight="500" fill="#202124">分析研发系统为何可能漏掉并发问题。</text><text x="15" y="232" text-anchor="start" font-size="10" font-weight="400" fill="#202124">建立 Agent Eval，验证测试专家能否主动提出反例；</text><text x="15" y="246" text-anchor="start" font-size="10" font-weight="400" fill="#202124">如有必要，改进测试专家的工作协议。</text><path d="M170 255 v17" stroke="#64748b" fill="none" stroke-width="1.3"/><rect x="5" y="272" width="330" height="44" rx="5" stroke="#16a34a" fill="#16a34a" fill-opacity="0.08"/><text x="170" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">下一个功能切片自动受益</text><text x="170" y="305" text-anchor="middle" font-size="10" font-weight="400" fill="#202124">产品正确性提高，测试能力提高，AI 研发能力也提高。</text></svg>
